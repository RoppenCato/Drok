<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving Atlases</title>
<meta name="description" content="One or two atlases drawn by origin at their real delays on a stage picture, with a switch to compare, for judging motion on a phone.">
<!--
  The moving page (the template's, 2026-11-04, from the board world game's pages). Fill the JSON block below and put
  the atlas files and the stage picture beside this file; publish the folder as an artifact with them under "files".
  Everything in the JSON is optional except "atlases"; sizes are CSS pixels; the atlas is in the studio's atlas form
  (frames by name, an "actions" block with origin, delay, lt, rb, head, a0, a1; meta.filePx says the files' scale).
-->
<script type="application/json" id="config">
{
  "title": "The slime, before and after",
  "note": "Drawn from the packed atlases at their real delays and real size. Facing left, as in a fight. Switch flips between the two atlases at the same frame.",
  "stage": { "picture": "stage.png", "width": 412, "height": 480, "ground": 400, "feet": 300, "sky": "#5fb0ec", "sky2": "#cdebfb", "soil": "#5c4a30", "grass": "#86d458" },
  "player": { "picture": "player.png", "feet": 100, "height": 150 },
  "filePx": 2,
  "spread": 150,
  "sizes": [ { "label": "Real", "k": 1 }, { "label": "Board, 0.3", "k": 0.3 }, { "label": "Three times", "k": 3 } ],
  "names": { "stand": "Stand", "move": "Walk", "fly": "Fly", "attack1": "Attack", "hit1": "Hit", "die1": "Fall", "defend": "Defend" },
  "atlases": [
    { "label": "1. Before", "json": "before/slime.json", "png": "before/slime.png", "scale": 1, "flip": false },
    { "label": "2. After", "json": "after/slime.json", "png": "after/slime.png", "scale": 1, "flip": false }
  ]
}
</script>
<style>
  :root { --bg: #f1ece2; --panel: #e4ddcf; --fg: #2a2436; --muted: #6b6273; --line: #c9c0b0; --btn: #fff8ec; --on: #2a2436; --onfg: #f6efe4; --accent: #d85a2a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1a22; --panel: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --btn: #312d3b; --on: #f4c14a; --onfg: #2a2030; --accent: #ff7a44; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1c1a22; --panel: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --btn: #312d3b; --on: #f4c14a; --onfg: #2a2030; --accent: #ff7a44; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  canvas { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--panel); touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); width: 100%; margin-top: 2px; }
  button { font: inherit; font-size: 14px; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--on); color: var(--onfg); border-color: var(--on); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #state { font-variant-numeric: tabular-nums; min-height: 20px; }
  #error { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">Moving atlases</h1>
  <p id="note"></p>
  <canvas id="c" width="824" height="960"></canvas>
  <p id="state"></p>
  <p id="error"></p>
  <div class="row" id="atlases"></div>
  <div class="row" id="actions"></div>
  <div class="row" id="controls"></div>
</main>
<script>
(async () => {
  const CFG = JSON.parse(document.getElementById('config').textContent);
  const $ = id => document.getElementById(id), load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('could not load ' + src)); i.src = src; });
  const ST = Object.assign({ width: 412, height: 480, ground: 400, feet: 300, sky: '#5fb0ec', sky2: '#cdebfb', soil: '#5c4a30', grass: '#86d458' }, CFG.stage || {});
  const NAMES = Object.assign({ stand: 'Stand', move: 'Walk', fly: 'Fly', attack1: 'Attack', hit1: 'Hit', die1: 'Fall', defend: 'Defend' }, CFG.names || {}), SIZES = CFG.sizes || [{ label: 'Real', k: 1 }], SPREAD = CFG.spread || 150;
  $('title').textContent = CFG.title || 'Moving atlases'; document.title = CFG.title || document.title; $('note').textContent = CFG.note || '';
  const c = $('c'), g = c.getContext('2d'); c.width = ST.width * 2; c.height = ST.height * 2; c.style.aspectRatio = ST.width + ' / ' + ST.height;

  // ---- the files: every atlas's json and png, the stage picture, the player's still (each optional but the atlases)
  const A = CFG.atlases || []; let stagePic = null, playerPic = null;
  const say = (where, e) => { $('error').textContent += `${where}: ${e.message || e}. `; };
  if (ST.picture) { try { stagePic = await load(ST.picture); } catch (e) { say('stage', e); } }
  if (CFG.player && CFG.player.picture) { try { playerPic = await load(CFG.player.picture); } catch (e) { say('player', e); } }
  for (const a of A) { try { a.J = await (await fetch(a.json)).json(); a.im = await load(a.png); a.px = a.J.meta && a.J.meta.filePx || CFG.filePx || 2; } catch (e) { say(a.label, e); a.J = null; } }
  const ready = A.filter(a => a.J); if (!ready.length) { $('state').textContent = 'No atlas could be loaded.'; return; }

  // ---- the state: which atlas, which action (or all in turn), where in the sequence, playing, speed, size, boxes, both
  let cur = ready[0], act = 'all', k = 0, t = 0, playing = true, speed = 1, size = SIZES[0], boxes = false, both = false, seq = null;
  const actionNames = []; for (const a of ready) for (const n of Object.keys(a.J.actions)) if (!actionNames.includes(n)) actionNames.push(n);   // the union, so the picker holds when switching
  function sequence(a) {   // loops twice, one-shots once, in the atlas's order; a single one-shot action holds its last frame half a second
    const s = [], add = (n, loops) => { const Ac = a.J.actions[n]; if (!Ac) return; for (let l = 0; l < loops; l++) Ac.frames.forEach((F, i) => s.push({ act: n, i, F, delay: F.delay || Ac.delay || 100 })); };
    if (act === 'all') { for (const n of Object.keys(a.J.actions)) add(n, a.J.actions[n].loop ? 2 : 1); }
    else { add(act, 1); const Ac = a.J.actions[act]; if (Ac && !Ac.loop && s.length) s.push(Object.assign({}, s[s.length - 1], { delay: 500, hold: true })); }
    if (!s.length) { const n = Object.keys(a.J.actions)[0]; add(n, 1); }
    return s;
  }
  function restart() { seq = sequence(cur); k = 0; t = 0; }
  function switchTo(a) {   // keep the action and the frame when the other atlas has them, so the eye sees the difference, not a restart
    const was = seq && seq[k]; cur = a; seq = sequence(cur);
    const j = was ? seq.findIndex(e => e.act === was.act && e.i === was.i) : -1; k = j >= 0 ? j : 0; t = Math.min(t, seq[k].delay); paint();
  }

  // ---- the controls
  const row = (box, items, get, set) => { box.innerHTML = ''; for (const it of items) { const b = document.createElement('button'); b.textContent = it.label; b.setAttribute('aria-pressed', String(get() === it.value)); b.onclick = () => { set(it.value); paint(); }; box.append(b); } };
  function paint() {
    row($('atlases'), ready.map(a => ({ label: a.label, value: a })), () => cur, a => switchTo(a));
    if (ready.length > 1) {
      const sw = document.createElement('button'); sw.textContent = 'Switch'; sw.onclick = () => switchTo(ready[(ready.indexOf(cur) + 1) % ready.length]); $('atlases').append(sw);
      const bt = document.createElement('button'); bt.textContent = 'Both'; bt.setAttribute('aria-pressed', String(both)); bt.onclick = () => { both = !both; paint(); }; $('atlases').append(bt);
    }
    row($('actions'), [{ label: 'All in turn', value: 'all' }, ...actionNames.map(n => ({ label: NAMES[n] || n, value: n }))], () => act, v => { act = v; restart(); });
    const C = $('controls'); C.innerHTML = '';
    const b = (label, pressed, fn) => { const x = document.createElement('button'); x.textContent = label; if (pressed !== null) x.setAttribute('aria-pressed', String(pressed)); x.onclick = () => { fn(); paint(); }; C.append(x); return x; };
    b(playing ? 'Pause' : 'Play', null, () => { playing = !playing; last = performance.now(); });
    for (const s of [[1, 'Real speed'], [0.5, 'Half'], [0.25, 'Quarter']]) b(s[1], speed === s[0], () => { speed = s[0]; });
    b('Step', null, () => { playing = false; k = (k + 1) % seq.length; t = 0; });
    for (const s of SIZES) b(s.label, size === s, () => { size = s; });
    b('Boxes', boxes, () => { boxes = !boxes; });
  }

  // ---- drawing: the stage, the player's still, then the current frame by its origin at the feet, faded by a0 and a1
  function stage() {
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, ST.width, ST.height); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    if (stagePic) g.drawImage(stagePic, 0, 0, ST.width, ST.height);
    else { const s = g.createLinearGradient(0, 0, 0, ST.ground); s.addColorStop(0, ST.sky); s.addColorStop(1, ST.sky2); g.fillStyle = s; g.fillRect(0, 0, ST.width, ST.ground); g.fillStyle = ST.grass; g.fillRect(0, ST.ground - 8, ST.width, 8); g.fillStyle = ST.soil; g.fillRect(0, ST.ground, ST.width, ST.height - ST.ground); }
    if (playerPic) { const P = CFG.player, h = P.height || 150, w = playerPic.width * h / playerPic.height; shadow(P.feet, w * 0.42); g.drawImage(playerPic, P.feet - w / 2, ST.ground - h, w, h); }
  }
  function shadow(x, rx) { g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(x, ST.ground + 2, rx, rx * 0.26, 0, 0, 7); g.fill(); }
  function frameOf(a, e) {   // the same action and frame in atlas a, if it has them; else nothing is drawn for it
    const Ac = a.J.actions[e.act]; if (!Ac) return null; const F = Ac.frames[Math.min(e.i, Ac.frames.length - 1)]; return F && a.J.frames[F.name] ? F : null;
  }
  function drawAtlas(a, e, x, phase) {
    const F = frameOf(a, e); if (!F) return; const fr = a.J.frames[F.name].frame, s = size.k * (a.scale || 1) / a.px;
    let alpha = 1; if (F.a0 !== undefined) { const a0 = F.a0 / 255, a1 = (F.a1 !== undefined ? F.a1 : F.a0) / 255; alpha = a0 + (a1 - a0) * phase; }
    const w = (F.rb.x - F.lt.x) * s; shadow(x, Math.max(14, w * 0.5));
    g.save(); g.translate(x, ST.ground); if (a.flip) g.scale(-1, 1); g.globalAlpha = alpha;
    g.drawImage(a.im, fr.x, fr.y, fr.w, fr.h, -F.origin.x * s, -F.origin.y * s, fr.w * s, fr.h * s); g.globalAlpha = 1;
    if (boxes) {   // the hit box and the head point, from the frame's data
      g.lineWidth = 1; g.strokeStyle = 'rgba(255,60,60,0.9)'; g.strokeRect(F.lt.x * s, F.lt.y * s, (F.rb.x - F.lt.x) * s, (F.rb.y - F.lt.y) * s);
      g.strokeStyle = 'rgba(40,120,255,0.9)'; g.beginPath(); g.moveTo(F.head.x * s - 6, F.head.y * s); g.lineTo(F.head.x * s + 6, F.head.y * s); g.moveTo(F.head.x * s, F.head.y * s - 6); g.lineTo(F.head.x * s, F.head.y * s + 6); g.stroke();
      g.strokeStyle = 'rgba(0,0,0,0.6)'; g.beginPath(); g.moveTo(-10, 0); g.lineTo(10, 0); g.stroke();
    }
    g.restore();
  }
  let last = performance.now();
  function tick(now) {
    requestAnimationFrame(tick); if (!seq) restart();
    const dt = (now - last) * (playing ? speed : 0); last = now; t += dt;
    while (t >= seq[k].delay) { t -= seq[k].delay; k = (k + 1) % seq.length; }
    const e = seq[k], phase = Math.min(1, t / e.delay); stage();
    if (both && ready.length > 1) ready.forEach((a, i) => drawAtlas(a, e, ST.feet + (i - (ready.length - 1) / 2) * SPREAD * (size.k < 1 ? 0.5 : 1), phase));
    else drawAtlas(cur, e, ST.feet, phase);
    $('state').textContent = `${cur.label}: ${NAMES[e.act] || e.act} ${String(e.i + 1).padStart(2, '0')} of ${cur.J.actions[e.act] ? cur.J.actions[e.act].frames.length : '?'}, ${e.hold ? 'held' : e.delay + ' ms'}${speed !== 1 ? ', at ' + speed + ' of real speed' : ''}`;
  }
  restart(); paint(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
