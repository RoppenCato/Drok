<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick One</title>
<meta name="description" content="Numbered pictures with a label and one line each, for Robin to pick from on his phone and answer in the chat.">
<!--
  The pick page (the template's, 2026-11-04). Fill the JSON block below and put the pictures beside this file; publish
  the folder as an artifact with them under "files". Robin answers in the chat with the number. Tapping a picture
  shows it full size; the browser's own pinch zoom works on it.
-->
<script type="application/json" id="config">
{
  "title": "Three looks for the hero",
  "note": "Answer in the chat with the number. Tap a picture to see it full size.",
  "items": [
    { "n": 1, "label": "Storybook line", "line": "One black line, flat fills, one shade, noon light.", "src": "1.png" },
    { "n": 2, "label": "Soft meadow", "line": "No line on the scenery, soft shade, late light.", "src": "2.png" },
    { "n": 3, "label": "Enchanted twilight", "line": "The line hand, a dusk palette, lanterns and glows.", "src": "3.png" }
  ]
}
</script>
<style>
  :root { --bg: #f1ece2; --card: #ffffff; --fg: #2a2436; --muted: #6b6273; --line: #c9c0b0; --badge: #f4c14a; --badgefg: #2a2030; --accent: #d85a2a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1a22; --card: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --badge: #f4c14a; --badgefg: #2a2030; --accent: #ff7a44; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1c1a22; --card: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --badge: #f4c14a; --badgefg: #2a2030; --accent: #ff7a44; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; gap: 8px; padding-bottom: 12px; align-content: start; }
  .pic { position: relative; margin: 0; background: #000; cursor: zoom-in; }
  .pic img { display: block; width: 100%; height: auto; }
  .n { position: absolute; top: 10px; left: 10px; width: 56px; height: 56px; border-radius: 50%; background: var(--badge); color: var(--badgefg); font-weight: 800; font-size: 32px; line-height: 56px; text-align: center; border: 3px solid #2a2030; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  h2 { font-size: 18px; margin: 0; padding: 0 14px; }
  .card p { padding: 0 14px; }
  #big { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; overflow: auto; z-index: 9; cursor: zoom-out; }
  #big.on { display: block; }
  #big img { display: block; margin: 0 auto; max-width: none; }
  #big .n { position: fixed; }
</style>
</head>
<body>
<main>
  <h1 id="title">Pick one</h1>
  <p id="note"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="big" role="dialog" aria-label="The picture at full size"><span class="n" id="bign"></span><img id="bigimg" alt=""></div>
<script>
  const CFG = JSON.parse(document.getElementById('config').textContent), $ = id => document.getElementById(id);
  $('title').textContent = CFG.title || 'Pick one'; document.title = CFG.title || document.title; $('note').textContent = CFG.note || 'Answer in the chat with the number.';
  const big = $('big'), bigimg = $('bigimg'), bign = $('bign');
  (CFG.items || []).forEach((it, i) => {
    const n = it.n !== undefined ? it.n : i + 1, card = document.createElement('article'); card.className = 'card';
    const fig = document.createElement('figure'); fig.className = 'pic';
    const img = document.createElement('img'); img.src = it.src; img.alt = `${n}. ${it.label || ''}`; img.loading = 'lazy';
    const badge = document.createElement('span'); badge.className = 'n'; badge.textContent = n;
    fig.append(img, badge); fig.onclick = () => { bigimg.src = it.src; bigimg.alt = img.alt; bign.textContent = n; big.classList.add('on'); };
    const h = document.createElement('h2'); h.textContent = `${n}. ${it.label || ''}`;
    const p = document.createElement('p'); p.textContent = it.line || '';
    card.append(fig, h, p); $('grid').append(card);
  });
  big.onclick = () => big.classList.remove('on');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') big.classList.remove('on'); });
</script>
</body>
</html>
