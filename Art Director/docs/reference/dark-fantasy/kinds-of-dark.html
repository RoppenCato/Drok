<title>Kinds of Dark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nine old paintings and book pictures, numbered, to say which kinds of dark fit the game and which do not.">
<!--
  The template's pick page (C:\dev\2D game template\sites\pick.html, 2026-11-04), filled for the first question about
  the look (Leonard, AD, 2026-11-20). The pictures sit beside this file and are published under "files". Robin answers
  in the chat with the numbers. Tapping a picture shows it full size; the browser's own pinch zoom works on it.
-->
<script type="application/json" id="config">
{
  "title": "Which kind of dark?",
  "note": "Answer in the chat with numbers: the ones you like, and the ones you do not. Tap a picture to see it full size. These are old paintings and book pictures, free for anyone to use. They show kinds of dark, not what the game will look like.",
  "items": [
    { "n": 1, "label": "Scratchy ink line, pale wash", "line": "Arthur Rackham, 1910. A nervous pen line, tinted thin. Gnarled and crawling; every creature a little ugly.", "src": "1-rackham-rhinegold.jpg" },
    { "n": 2, "label": "Pale mist, fine pencil marks", "line": "Theodor Kittelsen, 1906. Soft and grey; the monster is the hill itself. Eerie and quiet more than grim.", "src": "2-kittelsen-forest-troll.jpg" },
    { "n": 3, "label": "Black and white, engraved", "line": "Gustave Doré, 1857. Grim and real, the light cut out of black. Almost no colour at all.", "src": "3-dore-dark-forest.jpg" },
    { "n": 4, "label": "Clean outline, flat colour", "line": "Ivan Bilibin, 1900. Folk-tale dark: strong shapes, every colour chosen. Reads well when it is small.", "src": "4-bilibin-baba-yaga.jpg" },
    { "n": 5, "label": "Warm browns, chunky, one bright thing", "line": "John Bauer, 1915. Storybook dark: big round creatures in earth colours, and one thing that glows.", "src": "5-bauer-trolls.jpg" },
    { "n": 6, "label": "Fire against black, huge", "line": "John Martin, about 1851. Loud: red light on black rock, a world coming down.", "src": "6-martin-day-of-wrath.jpg" },
    { "n": 7, "label": "Brown fog, a ruin, almost no colour", "line": "Caspar David Friedrich, about 1810. Bare trees and a ruin at dusk. Lonely and still.", "src": "7-friedrich-abbey.jpg" },
    { "n": 8, "label": "A painted knight at dusk", "line": "Viktor Vasnetsov, 1882. A hero in a real, painted world: bones in the grass and a low sun.", "src": "8-vasnetsov-knight.jpg" },
    { "n": 9, "label": "Cold stone, still water, painted", "line": "Arnold Böcklin, 1883. Solid and painted: pale rock, black trees, flat water. Grave, not scary.", "src": "9-boecklin-isle-of-the-dead.jpg" }
  ]
}
</script>
<style>
  :root { --bg: #f1ece2; --card: #ffffff; --fg: #2a2436; --muted: #6b6273; --line: #c9c0b0; --badge: #f4c14a; --badgefg: #2a2030; --badgeline: #2a2030; --stage: #000000; --veil: rgba(0,0,0,0.92); --shadow: rgba(0,0,0,0.35); color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1a22; --card: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --badge: #f4c14a; --badgefg: #2a2030; --badgeline: #2a2030; --stage: #000000; --veil: rgba(0,0,0,0.92); --shadow: rgba(0,0,0,0.35); color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1c1a22; --card: #26232e; --fg: #f0e8d8; --muted: #a79fb0; --line: #3a3544; --badge: #f4c14a; --badgefg: #2a2030; --badgeline: #2a2030; --stage: #000000; --veil: rgba(0,0,0,0.92); --shadow: rgba(0,0,0,0.35); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; gap: 8px; padding-bottom: 12px; align-content: start; min-width: 0; }
  .pic { position: relative; margin: 0; background: var(--stage); cursor: zoom-in; border: 0; padding: 0; width: 100%; display: block; }
  .pic:focus-visible { outline: 3px solid var(--badge); outline-offset: -3px; }
  .pic img { display: block; width: 100%; height: auto; }
  .n { position: absolute; top: 10px; left: 10px; width: 56px; height: 56px; border-radius: 50%; background: var(--badge); color: var(--badgefg); font-weight: 800; font-size: 32px; line-height: 50px; text-align: center; border: 3px solid var(--badgeline); box-shadow: 0 2px 6px var(--shadow); }
  h2 { font-size: 18px; margin: 0; padding: 0 14px; }
  .card p { padding: 0 14px; }
  #big { position: fixed; inset: 0; background: var(--veil); overflow: auto; z-index: 9; cursor: zoom-out; }
  #big img { display: block; margin: 0 auto; max-width: none; }
  #big .n { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); }
</style>
<main>
  <h1 id="title">Pick one</h1>
  <p id="note"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="big" role="dialog" aria-label="The picture at full size" hidden><span class="n" id="bign"></span><img id="bigimg" alt=""></div>
<script>
  const CFG = JSON.parse(document.getElementById('config').textContent), $ = id => document.getElementById(id);
  $('title').textContent = CFG.title || 'Pick one'; $('note').textContent = CFG.note || 'Answer in the chat with the number.';
  const big = $('big'), bigimg = $('bigimg'), bign = $('bign');
  (CFG.items || []).forEach((it, i) => {
    const n = it.n !== undefined ? it.n : i + 1, card = document.createElement('article'); card.className = 'card';
    const fig = document.createElement('button'); fig.className = 'pic'; fig.type = 'button'; fig.setAttribute('aria-label', `Show picture ${n} at full size`);
    const img = document.createElement('img'); img.src = it.src; img.alt = `${n}. ${it.label || ''}`; img.loading = 'lazy';
    const badge = document.createElement('span'); badge.className = 'n'; badge.textContent = n;
    fig.append(img, badge); fig.onclick = () => { bigimg.src = it.src; bigimg.alt = img.alt; bign.textContent = n; big.hidden = false; };
    const h = document.createElement('h2'); h.textContent = `${n}. ${it.label || ''}`;
    const p = document.createElement('p'); p.textContent = it.line || '';
    card.append(fig, h, p); $('grid').append(card);
  });
  big.onclick = () => { big.hidden = true; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') big.hidden = true; });
</script>
